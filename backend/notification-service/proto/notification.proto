syntax = "proto3";

package notification;

option go_package = "/internal/pb/notification;notificationpb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

service NotificationService {
  rpc GetNotifications(GetNotificationsRequest) returns (NotificationList);
  rpc MarkAsRead(MarkAsReadRequest) returns (google.protobuf.Empty);
  rpc SendNotification(SendNotificationRequest) returns (google.protobuf.Empty);
}

// --- Message Definitions ---

message Notification {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string message = 4;
  bool is_read = 5;
  string type = 6; 
  google.protobuf.Timestamp created_at = 7;
  string action_url = 8; 
}

// 1. Get Notifications
message GetNotificationsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
  string sort = 4;
}

message NotificationList {
  repeated Notification notifications = 1;
  int64 unread_count = 2;
}

// 2. Mark As Read
message MarkAsReadRequest {
  string notification_id = 1;
  string user_id = 2;
}

// 3. Send Notification (Internal Use)
message SendNotificationRequest {
  string user_id = 1;
  string title = 2;
  string message = 3;
  string type = 4;
}