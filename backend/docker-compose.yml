version: '3.8'

services:
  # 1. Kafka Broker Service
  kafka-broker:
    image: confluentinc/cp-kafka:7.6.1 # Use official and latest image
    container_name: kafka-broker
    ports:
      # Port for access from INSIDE Docker network (by Go services)
      - "9092:9092"
      # Port for access from OUTSIDE Docker (e.g. GUI tools on host)
      - "19092:19092"
      # Controller port required for KRaft mode
      - "9093:9093"

    environment:
      # --- KRaft Mode Configuration (Without Zookeeper) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller' # KRaft mode
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '3eKZ7cM3R2u5ZkJ9F0Q8xA'

      # --- Network & Listener Configuration ---
      KAFKA_LISTENERS: 'INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-broker:9092,EXTERNAL://localhost:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'

      # --- Best Practices: Basic Configuration ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:19092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

    networks:
      - ecomm-network

  # 2. (Optional) Kafka Management GUI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080" # Access UI at http://localhost:8090
    depends_on:
      kafka-broker:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: 'local-cluster'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka-broker:9092'
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - ecomm-network

# Custom network so all services can communicate using service names
networks:
  ecomm-network:
    driver: bridge
